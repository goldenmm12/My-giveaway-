<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giveaway Website</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; padding: 25px; border-radius: 16px; max-width: 420px; width: 100%; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    h2 { color: #38bdf8; text-align: center; margin-top: 0; font-size: 22px; }
    .rules { background: #0f172a; padding: 14px; border-radius: 8px; font-size: 14px; margin-bottom: 20px; border-left: 4px solid #38bdf8; line-height: 1.6; color: #cbd5e1; }
    .badge { background: #334155; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; color: #f43f5e; }
    .status { text-align: center; margin-bottom: 20px; }
    .input-box { margin-bottom: 15px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #94a3b8; }
    input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; outline: none; font-size: 14px; }
    input:focus { border-color: #38bdf8; }
    button { width: 100%; padding: 14px; background: #0284c7; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; font-size: 16px; margin-top: 10px; transition: 0.2s; }
    button:hover { background: #0369a1; }
    button:disabled { background: #475569; cursor: not-allowed; color: #94a3b8; }
    #msg { text-align: center; margin-top: 15px; font-weight: bold; line-height: 1.5; }
    .empty-msg { color: #94a3b8; font-size: 15px; }
  </style>
</head>
<body>

<div class="card">
  <h2 id="title">Loading...</h2>
  <div class="rules" id="rules">အချက်အလက်များကို ရယူနေပါသည်...</div>
  <div class="status" id="statusBox"><span class="badge" id="count-status">စစ်ဆေးနေသည်...</span></div>

  <form id="giveawayForm" style="display:none;">
    <div class="input-box" id="nameGroup">
      <label>အမည်</label>
      <input type="text" id="name" required placeholder="သင့်အမည် ထည့်ပါ">
    </div>

    <!-- MLBB / TikTok / Telegram အလိုက် Auto ပြောင်းမည့်နေရာ -->
    <div id="dynamicInputs"></div>

    <button type="submit" id="subBtn">ယူမယ်</button>
  </form>

  <div id="msg"></div>
</div>

<script>
  // သင့် API နှင့် Bot Credentials များကို ထည့်သွင်းပြီးပါပြီ
  const SHEETDB_API_URL = "https://sheetdb.io/api/v1/h8ehi7lkba6oa";
  const TELEGRAM_BOT_TOKEN = "8994040294:AAGXLqwDfOK9jrfjpLKcpeN6oXAog9oKOJk";
  const TELEGRAM_CHAT_ID = "5799387734";

  let currentFormType = "";
  let maxLimit = 0;
  let currentCount = 0;

  async function init() {
    try {
      // 1. Settings tab မှ အချက်အလက်ယူခြင်း
      const settingsRes = await fetch(`${SHEETDB_API_URL}?sheet=Settings`);
      const settingsData = await settingsRes.json();
      const setting = settingsData[0] || {};

      // 2. Participants tab မှ ယူပြီးသူ အရေအတွက် စစ်ဆေးခြင်း
      const partRes = await fetch(`${SHEETDB_API_URL}?sheet=Participants`);
      const partData = await partRes.json();
      currentCount = Array.isArray(partData) ? partData.length : 0;
      maxLimit = parseInt(setting.MaxLimit) || 0;
      currentFormType = setting.FormType ? setting.FormType.toLowerCase().trim() : "off";

      // Giveaway ပိတ်ထားလျှင် / Title မရှိလျှင် / MaxLimit 0 ဖြစ်နေလျှင်
      if (currentFormType === "off" || !setting.Title || maxLimit <= 0) {
        document.getElementById("title").innerText = "Giveaway မရှိသေးပါ";
        document.getElementById("rules").style.display = "none";
        document.getElementById("statusBox").style.display = "none";
        document.getElementById("msg").className = "empty-msg";
        document.getElementById("msg").innerText = "လောလောဆယ် ပြုလုပ်နေသော Giveaway မရှိသေးပါ။ နောက်မှ ပြန်လာကြည့်ပေးပါ။";
        return;
      }

      // ခေါင်းစဉ်နှင့် စည်းကမ်းချက်များ ပြသခြင်း
      document.getElementById("title").innerText = setting.Title;
      document.getElementById("rules").innerText = setting.Rules;
      document.getElementById("count-status").innerText = `ရယူပြီးသူ: ${currentCount} / ${maxLimit} ယောက်`;

      // FormType အလိုက် Input အကွက်များ ပြောင်းလဲပေးခြင်း
      renderInputs(currentFormType);

      // လူပြည့် မပြည့် စစ်ဆေးခြင်း
      if (currentCount >= maxLimit) {
        document.getElementById("count-status").innerText = `လူပြည့်သွားပါပြီ (${currentCount}/${maxLimit})`;
        document.getElementById("dynamicInputs").style.display = "none";
        document.getElementById("nameGroup").style.display = "none";
        document.getElementById("subBtn").disabled = true;
        document.getElementById("subBtn").innerText = "လူပြည့်သွားပါပြီ";
      }

      document.getElementById("giveawayForm").style.display = "block";

    } catch (err) {
      document.getElementById("title").innerText = "အချက်အလက် ရယူ၍ မရပါ";
      console.error(err);
    }
  }

  // FormType အလိုက် အကွက်ထုတ်ပေးသည့် Function
  function renderInputs(type) {
    const container = document.getElementById("dynamicInputs");
    container.innerHTML = "";

    if (type === "mlbb") {
      container.innerHTML = `
        <div class="input-box">
          <label>MLBB Game ID</label>
          <input type="number" id="detail1" required placeholder="ဥပမာ - 12345678">
        </div>
        <div class="input-box">
          <label>Zone ID</label>
          <input type="number" id="detail2" required placeholder="ဥပမာ - 1234">
        </div>`;
    } else if (type === "tiktok") {
      container.innerHTML = `
        <div class="input-box">
          <label>TikTok Video Link</label>
          <input type="url" id="detail1" required placeholder="https://vt.tiktok.com/...">
        </div>`;
    } else if (type === "telegram") {
      container.innerHTML = `
        <div class="input-box">
          <label>Telegram Post Link</label>
          <input type="url" id="detail1" required placeholder="https://t.me/...">
        </div>`;
    }
  }

  // Form Submit လုပ်သည့်အခါ
  document.getElementById("giveawayForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("subBtn");
    btn.disabled = true;
    btn.innerText = "ခဏစောင့်ပါ...";

    const name = document.getElementById("name").value;
    const detail1 = document.getElementById("detail1") ? document.getElementById("detail1").value : "";
    const detail2 = document.getElementById("detail2") ? document.getElementById("detail2").value : "";
    const dateStr = new Date().toLocaleString("en-US", { timeZone: "Asia/Yangon" });

    const postData = {
      data: [{ Name: name, Detail1: detail1, Detail2: detail2, Date: dateStr }]
    };

    try {
      const res = await fetch(`${SHEETDB_API_URL}?sheet=Participants`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(postData)
      });

      if (res.ok) {
        // Telegram သို့ Notification ပို့ခြင်း
        sendTelegram(name, detail1, detail2);

        document.getElementById("msg").style.color = "#4ade80";
        document.getElementById("msg").innerText = "ရယူခြင်း အောင်မြင်ပါသည်။";
        document.getElementById("giveawayForm").reset();

        currentCount++;
        document.getElementById("count-status").innerText = `ရယူပြီးသူ: ${currentCount} / ${maxLimit} ယောက်`;

        // လူပြည့်သွားပါက Form ကို ဖျောက်မည်
        if (currentCount >= maxLimit) {
          document.getElementById("count-status").innerText = `လူပြည့်သွားပါပြီ (${currentCount}/${maxLimit})`;
          document.getElementById("dynamicInputs").style.display = "none";
          document.getElementById("nameGroup").style.display = "none";
          btn.disabled = true;
          btn.innerText = "လူပြည့်သွားပါပြီ";
        } else {
          btn.disabled = false;
          btn.innerText = "ယူမယ်";
        }
      } else {
        throw new Error("Failed to submit");
      }

    } catch (err) {
      document.getElementById("msg").style.color = "#f87171";
      document.getElementById("msg").innerText = "မအောင်မြင်ပါ၊ ပြန်လည်ကြိုးစားပါ။";
      btn.disabled = false;
      btn.innerText = "ယူမယ်";
    }
  });

  // Telegram ထံ စာပို့ပေးသည့် Function
  function sendTelegram(name, d1, d2) {
    if (!TELEGRAM_BOT_TOKEN) return;

    let text = `🎉 <b>Giveaway Claim အသစ်!</b>\n\n👤 <b>အမည်:</b> ${name}\n`;
    if (currentFormType === "mlbb") text += `🎮 <b>MLBB ID:</b> ${d1} (${d2})\n`;
    if (currentFormType === "tiktok") text += `🎵 <b>TikTok Link:</b> ${d1}\n`;
    if (currentFormType === "telegram") text += `📲 <b>TG Post Link:</b> ${d1}\n`;

    text += `\n📊 <b>လက်ရှိ ရယူပြီးသူ:</b> ${currentCount + 1} / ${maxLimit} ယောက်`;

    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: text, parse_mode: "HTML" })
    });
  }

  init();
</script>
</body>
</html>
